MinimumPositionGain=4.0
SquadSupportDistance=8.0
SquadSeparationTiles=2.5
; Soft sampled blast risk. Radius is a formation heuristic, not native AoE size.
; Weight=0 disables this preference without blocking any legal destination.
SquadAreaRiskRadiusTiles=3.0
SquadAreaRiskWeight=6.0
; Mission-specific override for BerserkerMP on SabotageTransmitter (Blood Killer).
