; User-selected: reveal battlefield and all active hostile positions to AI.
; This does not bypass native ability targeting or action point costs.
[AutoplayXCom2.APX_FullIntel]
EnableFullIntel=true

; Native-geometry concealment estimates only; negative paths are penalized
; rather than rejected, so urgent objectives and rescue retain alternatives.
[AutoplayXCom2.APX_ConcealmentPlanner]
MaxPathTilesToInspect=48
MaxDetectorsToInspect=96
MaxNativeLOSChecksPerInspection=128
ConcealmentRiskPenalty=18.0

