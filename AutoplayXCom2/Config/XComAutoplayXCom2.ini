+AttackAbilities=DevastatingPunch
+AttackAbilities=DevastatingPunchMP
+HealAbilities=MedikitHeal
+HealAbilities=NanoMedikitHeal
+HealAbilities=GremlinHeal
+HealAbilities=Repair
