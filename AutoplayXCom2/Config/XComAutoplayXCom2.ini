; User-selected: reveal battlefield and all active hostile positions to AI.
; This does not bypass native ability targeting or action point costs.
[AutoplayXCom2.APX_FullIntel]
EnableFullIntel=true

; Native-geometry concealment estimates only; negative paths are penalized
; rather than rejected, so urgent objectives and rescue retain alternatives.
[AutoplayXCom2.APX_ConcealmentPlanner]
MaxPathTilesToInspect=48
MaxDetectorsToInspect=96
MaxNativeLOSChecksPerInspection=128
ConcealmentRiskPenalty=18.0

; Bounded one-decision contact snapshot for routine route safety evaluation.
; CLEAR means only the current known-state horizon, never a guaranteed
; future patrol route. CAUTION/UNKNOWN remain legal soft penalties.
[AutoplayXCom2.APX_ContactEnvelope]
MaxGroups=32
MaxMembers=128
MaxDetectors=64
MaxTiles=128
MaxLOS=512
CautionRoutePenalty=24.0
UnknownRoutePenalty=8.0

; Read-only stored patrol evidence; no future AI choice is generated.
; One shared member-reference budget covers all groups in each observation.
; Bounded patrol-variant staging. Waypoint/side corridors are uncertainty
; estimates, NEVER native selected future paths or native shot targets.
; Setup is optional and always defers to timers, rescue, evac and actual combat.
[AutoplayXCom2.APX_PatrolAmbushPlanner]
EnablePatrolAmbush=true
MaxSetupTurns=2
MaxSetupActions=3
MaxReactionSupport=3
MaxPositionSamples=24
MaxGroupChecks=24
MaxPatrolDistanceTiles=15.0
MinimumApproachGainTiles=1.5
WeakRevealedOpenerThreshold=60.0

[AutoplayXCom2.APX_PatrolKnowledge]
MaxGroupsPerObservation=32
MaxMemberReferencesPerObservation=128

; Mission-scoped BerserkerMP cooperation on SabotageTransmitter, not other
; units/missions. Uses current live AIGroup members, never future AI intent.
[AutoplayXCom2.APX_BerserkerFocus]
EnableBerserkerGroupFocus=true
; Allow at most two early turns of combat when the actual UI timer has slack.
OpeningContactTurns=2
MinimumContactTimerTurns=4
MaximumOpeningContactDistance=18.0
; One bounded scan shared by all controlled Berserkers in a decision.
MaxGroupsPerDecision=24
MaxMemberRefsPerDecision=128
MaxFriendlyUnitsPerDecision=12
; Includes rejected enemy/civilian/dead states; incomplete squad scan falls back.
MaxUnitStatesPerDecision=128

; Revealed ranged units select one currently squad-visible native AIGroup.
; Never promotes a distant hidden full-intel pod to an attack target.
[AutoplayXCom2.APX_RevealedFocus]
EnableRevealedGroupFocus=true
MaxGroupsPerDecision=24
MaxMembersPerDecision=128
MaxFriendlyStatesPerDecision=128
MaxSquadSize=12

[AutoplayXCom2.APX_Controller]
ToggleKey=F8
DecisionInterval=0.75
MaxActionsPerTurn=128
MaxSameActionPerTurn=8
AutoEndTurn=true
AutoCompleteOwnedHacks=true
ExploreUnseenMap=true
AutoPlaceEvac=true
UseExplosiveGrenades=true
EnableMissionRecording=true
RecordCandidateScores=true
RecordingInterval=1.0
; Diagnostic only: first marker after 15 s of the same wait reason,
; then at most every 30 s. Runtime clamps: first 10..120 s, repeat 15..180 s.
WaitHeartbeatFirstSeconds=15.0
WaitHeartbeatRepeatSeconds=30.0
ContactMemoryTurns=2
ContactSearchDistance=4.0
CoordinateConcealedAmbush=true

[AutoplayXCom2.APX_UITacticalControl]
; Coordinates in the stock 1920x1080 scaled UI; anchored at middle-right.
; Move this panel if another HUD mod uses the same area.
OffsetX=-220.0
OffsetY=-27.0
ButtonWidth=184.0
FadeSeconds=0.25
CollapseDelaySeconds=2.0
IndicatorAlpha=35.0
; Permanent toggle/status/score during tactical mission; false = old auto-hide.
AlwaysExpanded=true

[AutoplayXCom2.APX_CombatPlanner]
MinimumHitChance=15
EmergencyHealthFraction=0.45
