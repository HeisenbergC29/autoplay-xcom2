; Only basic ranged native-ready shots. The current native breakdown already
; includes its own height modifier, so we estimate the *additional* benefit
; of a reachable elevated tile and discount it for uncertainty.
[AutoplayXCom2.APX_RepositionPlanner]
EnableElevatedShotForecast=true
MaxElevationGainTiles=6
HeightForecastDiscount=5

[AutoplayXCom2.APX_MissionPlanner]
