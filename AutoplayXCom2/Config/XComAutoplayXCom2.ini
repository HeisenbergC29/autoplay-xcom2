EnableMissionRecording=true
RecordCandidateScores=true
RecordingInterval=1.0
ContactMemoryTurns=2
ContactSearchDistance=4.0
CoordinateConcealedAmbush=true

[AutoplayXCom2.APX_UITacticalControl]
