name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run public tests (private SDK/config contracts may skip)
        # No SDK or game files are installed on the hosted runner. unittest
        # reports skipped contracts separately; a green job is not a game test.
        run: python -m unittest discover -s tests -p "test_*.py" -v

  powershell:
    name: PowerShell helpers
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test build helpers without the WOTC compiler
        run: ./tests/Test-BuildHelpers.ps1
      - name: Test mission-report collection with disposable fixtures
        run: ./tests/Test-CollectMissionRecording.ps1
      - name: Test SDK-source collection with disposable fixtures
        run: ./tests/Test-CollectSdkSources.ps1
      - name: Test SDK snapshot collection in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-CollectSdkSources.ps1
      - name: Test reversible TLE duplicate repair with disposable fixtures
        run: ./tests/Test-RepairSdkTleDuplicates.ps1
      - name: Test TLE repair in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-RepairSdkTleDuplicates.ps1
